# ==========================================
# API GATEWAY - SHARED CONFIGURATION
# ==========================================
# Denna fil innehåller konfiguration som delas mellan alla miljöer
# Environment-specifik konfiguration finns i:
# - application-local.properties (IntelliJ utveckling)
# - application-prod.properties (Docker/Railway/Azure)

# =========================
# APPLICATION INFO
# =========================
spring.application.name=api-gateway
server.port=8080

# =========================
# ACTIVE PROFILE
# =========================
# Default till 'local' för IntelliJ utveckling
# Override med SPRING_PROFILES_ACTIVE=prod i Docker/Railway/Azure
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# GATEWAY CONFIGURATION
# =========================
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Timeouts
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30s

# Connection pool
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.max-idle-time=10s

# =========================
# JWT CONFIGURATION
# =========================
# CRITICAL: Must match UserService's JWT_SECRET!
# Production: Override via JWT_SECRET environment variable
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}

# =========================
# SERVICE-TO-SERVICE API KEY
# =========================
# Used for internal service-to-service authentication
# Production: Override via SERVICE_API_KEY environment variable
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# LOGGING
# =========================
spring.output.ansi.enabled=ALWAYS

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,gateway,metrics
management.endpoint.health.show-details=always
