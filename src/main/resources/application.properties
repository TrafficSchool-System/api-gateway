# =========================
# APPLICATION INFO
# =========================
spring.application.name=api-gateway
server.port=8080

# =========================
# EUREKA CLIENT
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# GATEWAY CONFIGURATION
# =========================
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Timeouts
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30s

# Connection pool
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.max-idle-time=10s

# =========================
# JWT CONFIGURATION
# =========================
# CRITICAL: Must match UserService's JWT_SECRET!
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}

# =========================
# SERVICE-TO-SERVICE API KEY
# =========================
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# LOGGING
# =========================
spring.output.ansi.enabled=ALWAYS
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.api_gateway=DEBUG
logging.level.com.example.api_gateway.Security.RateLimitFilter=DEBUG

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,gateway,metrics
management.endpoint.health.show-details=always
