spring.application.name=api-gateway
server.port=8080

# =========================
# EUREKA CLIENT CONFIG
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# GATEWAY CONFIGURATION
# =========================
# Disable automatic route creation from Eureka
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Global timeout settings
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30s

# Connection pool settings
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.max-idle-time=10s

# WebFlux settings
spring.webflux.base-path=/

# =========================
# JWT CONFIGURATION
# =========================
# VIKTIGT: Samma JWT_SECRET som UserService använder!
# Gateway validerar JWT som UserService har genererat
# I produktion: Använd miljövariabel JWT_SECRET
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}

# =========================
# SERVICE-TO-SERVICE CONFIGURATION
# =========================
# API-key för intern service-to-service kommunikation
# VIKTIGT: Måste matcha service.api.key i UserService!
# I produktion: Använd miljövariabel SERVICE_API_KEY
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# LOGGING
# =========================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.api_gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =========================
# ACTUATOR (optional - for monitoring)
# =========================
# management.endpoints.web.exposure.include=health,info,gateway
# management.endpoint.health.show-details=always
