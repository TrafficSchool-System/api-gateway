# =========================
# PRODUCTION PROFILE
# =========================
# Används i Docker Compose, Railway, Azure, Kubernetes
# Aktiveras med: SPRING_PROFILES_ACTIVE=prod

# =========================
# EUREKA CLIENT
# =========================
# ENABLED för service discovery
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# MICROSERVICES URLS
# =========================
# Azure Container Apps internal DNS - tjänstnamnet matchar Container App-namnet
# Dessa URLs bypassar Eureka och använder direkt DNS inom trafficschool-env
services.user-service.url=${USER_SERVICE_URL:http://user-service}
services.admin-service.url=${ADMIN_SERVICE_URL:http://admin-service}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://payment-service}
services.quiz-service.url=${QUIZ_SERVICE_URL:http://quiz-service}
services.exam-service.url=${EXAM_SERVICE_URL:http://exam-service}

# =========================
# LOGGING
# =========================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.api_gateway=INFO
logging.level.com.example.api_gateway.Security.RateLimitFilter=WARN
logging.level.com.example.api_gateway.Security.SubscriptionValidationFilter=INFO
