# =========================
# PRODUCTION PROFILE
# =========================
# Används i Docker Compose, Railway, Azure, Kubernetes
# Aktiveras med: SPRING_PROFILES_ACTIVE=prod

# =========================
# EUREKA CLIENT
# =========================
# ENABLED för service discovery
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# MICROSERVICES URLS
# =========================
# Eureka service discovery
# Gateway använder service-namn för UserService subscription check
services.user-service.url=http://user-service

# =========================
# LOGGING
# =========================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.api_gateway=INFO
logging.level.com.example.api_gateway.Security.RateLimitFilter=WARN
logging.level.com.example.api_gateway.Security.SubscriptionValidationFilter=INFO
