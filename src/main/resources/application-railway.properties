# =========================
# RAILWAY PRODUCTION PROFILE
# =========================

# Eureka - ENABLED for Railway
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance - Railway Private Networking
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=api-gateway
eureka.instance.non-secure-port=8080
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# Production timeouts
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=60s

# Logging - Production
logging.level.com.example.api_gateway=INFO
logging.level.org.springframework.cloud.gateway=WARN
