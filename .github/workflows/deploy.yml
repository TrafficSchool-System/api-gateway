name: Build & Deploy api-gateway

on:
  push:
    branches: [main]

env:
  APP_NAME: api-gateway
  RESOURCE_GROUP: trafficschool-rg
  ENVIRONMENT: trafficschool-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Logga in på Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Logga in på ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Bygg och pusha Docker-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:latest

      - name: Driftsätt till Azure Container Apps
        run: |
          az containerapp up \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.ENVIRONMENT }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:latest \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8080 \
            --ingress external \
            --min-replicas 1 \
            --max-replicas 3 \
            --env-vars \
              SPRING_PROFILES_ACTIVE=prod \
              JWT_SECRET=${{ secrets.JWT_SECRET }} \
              SERVICE_API_KEY=${{ secrets.SERVICE_API_KEY }} \
              FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
              EUREKA_URL=http://eureka-server/eureka/
